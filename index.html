<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Passdown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 1rem;
      background: #f5f5f5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 1rem 1.25rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 0.75rem;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .section {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 0.75rem;
      background: #fafafa;
    }

    .section-header {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .field-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .field {
      flex: 1 1 140px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      padding: 0.45rem 0.5rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 0.9rem;
      width: 100%;
    }

    textarea {
      min-height: 60px;
      resize: vertical;
    }

    button {
      padding: 0.55rem 0.75rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-small {
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    th, td {
      border: 1px solid #e5e7eb;
      padding: 0.45rem;
      text-align: left;
    }

    th {
      background: #f3f4f6;
      font-weight: 600;
    }

    .parts-table-empty {
      font-size: 0.85rem;
      color: #6b7280;
      padding: 0.25rem 0;
    }

    .footer-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .json-preview {
      font-family: "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.75rem;
      background: #111827;
      color: #d1d5db;
      padding: 0.5rem;
      border-radius: 8px;
      max-height: 200px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 600px) {
      .container {
        border-radius: 0;
        box-shadow: none;
        padding: 0.75rem;
      }

      h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Daily Passdown</h1>

  <form id="partsForm">
    <!-- Work info -->
    <div class="section">
      <div class="section-header">Work Details</div>

      <div class="field-row">
        <div class="field">
          <label for="workDate">Date</label>
          <input type="date" id="workDate" />
        </div>
        <div class="field">
          <label for="techName">Technician(s)</label>
          <input type="text" id="techName" placeholder="e.g. Chris Riddell, Tech 2" />
        </div>
        <div class="field" style="max-width:120px;">
          <label for="hoursWorked">Hours worked</label>
          <input type="number" id="hoursWorked" min="0" step="0.25" placeholder="e.g. 8" />
        </div>
      </div>

      <div class="field">
        <label for="region">Region</label>
        <select id="region">
          <option value="">Select region</option>
          <option value="West Mountain">West Mountain</option>
          <option value="Ogden Valley">Ogden Valley</option>
          <option value="Heber">Heber</option>
          <option value="Park City">Park City</option>
          <option value="Wasatch Front">Wasatch Front</option>
          <option value="Other">Other (add in notes)</option>
        </select>
      </div>

      <div class="field">
        <label for="generalNotes">Notes</label>
        <textarea id="generalNotes" placeholder="Anything special about this job, span, or area..."></textarea>
      </div>
    </div>

    <!-- Segment save/load -->
    <div class="section">
      <div class="section-header">Saved Segments</div>

      <div class="field-row">
        <div class="field">
          <label for="segmentName">Segment name</label>
          <input type="text" id="segmentName" placeholder="e.g. Terminal Pole - Heber Standard" />
        </div>

        <div class="field">
          <label for="savedSegmentSelect">Load saved segment</label>
          <select id="savedSegmentSelect">
            <option value="">Select saved segment</option>
          </select>
        </div>
      </div>

      <div class="button-row">
        <button type="button" class="btn-secondary" id="saveSegmentBtn">Save segment</button>
        <button type="button" class="btn-secondary" id="loadSegmentBtn">Load segment</button>
        <button type="button" class="btn-danger btn-small" id="deleteSegmentBtn">Delete segment</button>
      </div>
    </div>

    <!-- Assembly selection -->
    <div class="section">
      <div class="section-header">Assemblies used today</div>
      <div class="field-row">
        <div class="field">
          <label for="assemblySelect">Assembly type</label>
          <select id="assemblySelect">
            <option value="">Select assembly</option>
            <option value="terminalPole">Terminal Pole Assembly</option>
            <option value="downGuyAnchorPole">Down Guy Anchor Pole Assembly</option>
            <option value="intermediatePole">Intermediate Pole Assembly</option>
            <option value="lashingIntermediatePole">Lashing Intermediate Pole Assembly</option>
            <option value="poleRiser">Pole Riser Assembly</option>
            <option value="snowshoeAssembly">Snowshoe Assembly</option>
          </select>
        </div>
        <div class="field" style="max-width:120px;">
          <label for="assemblyQty">Qty</label>
          <input type="number" id="assemblyQty" min="1" value="1" />
        </div>
      </div>
      <div class="button-row">
        <button type="button" class="btn-secondary" id="addAssemblyBtn">Add assembly parts</button>
        <button type="button" class="btn-danger btn-small" id="clearPartsBtn">Clear all parts</button>
      </div>
    </div>

    <!-- Custom part add -->
    <div class="section">
      <div class="section-header">Add Custom Part</div>
      <div class="field-row">
        <div class="field">
          <label for="partCategory">Part Category</label>
          <select id="partCategory">
            <option value="All">All</option>
          </select>
        </div>
        <div class="field">
          <label for="partSelect">Part</label>
          <select id="partSelect"></select>
        </div>
        <div class="field" style="max-width:120px;">
          <label for="partQty">Qty</label>
          <input type="number" id="partQty" min="1" value="1" />
        </div>
      </div>
      <div class="button-row">
        <button type="button" class="btn-secondary" id="addPartBtn">Add part</button>
      </div>
    </div>

    <!-- Parts table -->
    <div class="section">
      <div class="section-header">Parts Used (Total for This Entry)</div>
      <div id="partsTableContainer"></div>
    </div>

    <!-- Submit -->
    <div class="section">
      <div class="footer-row">
        <button type="submit" class="btn-primary">Submit Daily Passdown</button>
        <small>Submitting will send this entry to the Google Sheet.</small>
      </div>
      <div id="jsonPreview" class="json-preview"></div>
    </div>
  </form>
</div>

  const partsUsed = {};

  function getPartById(id) {
    return partsCatalog.find(p => p.id === id);
  }

  function addPartToUsage(partId, qty) {
    const part = getPartById(partId);
    if (!part) {
      alert("Unknown part: " + partId);
      return;
    }

    const quantity = Number(qty) || 0;
    if (quantity <= 0) return;

    if (!partsUsed[partId]) {
      partsUsed[partId] = {
        id: part.id,
        name: part.name,
        unit: part.unit,
        qty: 0,
      };
    }

    partsUsed[partId].qty += quantity;
    renderPartsTable();
  }

  function removePart(partId) {
    delete partsUsed[partId];
    renderPartsTable();
  }
  window.removePart = removePart;

  function clearAllParts() {
    Object.keys(partsUsed).forEach(k => delete partsUsed[k]);
    Object.keys(assembliesUsed).forEach(k => delete assembliesUsed[k]);
    renderPartsTable();
  }

  function renderPartsTable() {
    const container = document.getElementById("partsTableContainer");
    const entries = Object.values(partsUsed);

    if (entries.length === 0) {
      container.innerHTML = '<div class="parts-table-empty">No parts added yet. Use assemblies or add custom parts.</div>';
      return;
    }

    let html = '<table><thead><tr>' +
      '<th>Part ID</th><th>Description</th><th>Qty</th><th>Unit</th><th>Actions</th>' +
      '</tr></thead><tbody>';

    entries.forEach(item => {
      html += `<tr>
        <td>${item.id}</td>
        <td>${item.name}</td>
        <td>${item.qty}</td>
        <td>${item.unit}</td>
        <td><button type="button" class="btn-small btn-danger" onclick="removePart('${item.id}')">Remove</button></td>
      </tr>`;
    });

    html += "</tbody></table>";
    container.innerHTML = html;
  }

  function initPartCategories() {
    const categorySelect = document.getElementById("partCategory");
    const categories = [...new Set(partsCatalog.map(p => p.category || "Other"))].sort();

    categorySelect.innerHTML = '<option value="All">All</option>';

    categories.forEach(category => {
      const opt = document.createElement("option");
      opt.value = category;
      opt.textContent = category;
      categorySelect.appendChild(opt);
    });
  }

  function initPartDropdown(categoryFilter = "All") {
    const select = document.getElementById("partSelect");
    select.innerHTML = "";

    const defaultOpt = document.createElement("option");
    defaultOpt.value = "";
    defaultOpt.textContent = "Select part";
    select.appendChild(defaultOpt);

    const filteredParts = categoryFilter === "All"
      ? partsCatalog
      : partsCatalog.filter(part => (part.category || "Other") === categoryFilter);

    filteredParts
      .sort((a, b) => a.name.localeCompare(b.name))
      .forEach(part => {
        const opt = document.createElement("option");
        opt.value = part.id;
        opt.textContent = `${part.name} (${part.id})`;
        select.appendChild(opt);
      });
  }

  function initDate() {
    const dateInput = document.getElementById("workDate");
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    dateInput.value = `${yyyy}-${mm}-${dd}`;
  }

  function getSavedSegments() {
    try {
      return JSON.parse(localStorage.getItem(SEGMENTS_STORAGE_KEY)) || {};
    } catch (err) {
      console.error("Error reading saved segments:", err);
      return {};
    }
  }

  function saveSegmentsToStorage(segments) {
    localStorage.setItem(SEGMENTS_STORAGE_KEY, JSON.stringify(segments));
  }

  function populateSavedSegmentsDropdown() {
    const select = document.getElementById("savedSegmentSelect");
    const segments = getSavedSegments();

    select.innerHTML = '<option value="">Select saved segment</option>';

    Object.keys(segments)
      .sort((a, b) => a.localeCompare(b))
      .forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
  }

  function saveCurrentSegment() {
    const segmentName = document.getElementById("segmentName").value.trim();

    if (!segmentName) {
      alert("Enter a segment name first.");
      return;
    }

    const segments = getSavedSegments();

    if (segments[segmentName] && !confirm(`Overwrite saved segment "${segmentName}"?`)) {
      return;
    }

    segments[segmentName] = {
      region: document.getElementById("region").value,
      notes: document.getElementById("generalNotes").value.trim(),
      assembliesUsed: { ...assembliesUsed },
      partsUsed: JSON.parse(JSON.stringify(partsUsed)),
    };

    saveSegmentsToStorage(segments);
    populateSavedSegmentsDropdown();
    document.getElementById("savedSegmentSelect").value = segmentName;

    alert(`Segment "${segmentName}" saved.`);
  }

  function loadSavedSegment() {
    const selectedName = document.getElementById("savedSegmentSelect").value;

    if (!selectedName) {
      alert("Select a saved segment first.");
      return;
    }

    const segments = getSavedSegments();
    const segment = segments[selectedName];

    if (!segment) {
      alert("Saved segment not found.");
      return;
    }

    clearAllParts();

    document.getElementById("region").value = segment.region || "";
    document.getElementById("generalNotes").value = segment.notes || "";
    document.getElementById("segmentName").value = selectedName;

    Object.keys(assembliesUsed).forEach(k => delete assembliesUsed[k]);
    Object.assign(assembliesUsed, segment.assembliesUsed || {});

    Object.keys(partsUsed).forEach(k => delete partsUsed[k]);
    Object.assign(partsUsed, segment.partsUsed || {});

    renderPartsTable();

    alert(`Segment "${selectedName}" loaded.`);
  }

  function deleteSavedSegment() {
    const selectedName = document.getElementById("savedSegmentSelect").value;

    if (!selectedName) {
      alert("Select a saved segment first.");
      return;
    }

    if (!confirm(`Delete saved segment "${selectedName}"?`)) {
      return;
    }

    const segments = getSavedSegments();
    delete segments[selectedName];
    saveSegmentsToStorage(segments);
    populateSavedSegmentsDropdown();

    document.getElementById("savedSegmentSelect").value = "";
    if (document.getElementById("segmentName").value.trim() === selectedName) {
      document.getElementById("segmentName").value = "";
    }

    alert(`Segment "${selectedName}" deleted.`);
  }

  /****************************************************
   * 4. Wire up events
   ****************************************************/
  document.addEventListener("DOMContentLoaded", () => {
    initPartCategories();
    initPartDropdown();
    initDate();
    renderPartsTable();
    populateSavedSegmentsDropdown();

    const addAssemblyBtn = document.getElementById("addAssemblyBtn");
    const clearPartsBtn = document.getElementById("clearPartsBtn");
    const addPartBtn = document.getElementById("addPartBtn");
    const form = document.getElementById("partsForm");
    const jsonPreview = document.getElementById("jsonPreview");
    const partCategory = document.getElementById("partCategory");
    const regionSelect = document.getElementById("region");
    const saveSegmentBtn = document.getElementById("saveSegmentBtn");
    const loadSegmentBtn = document.getElementById("loadSegmentBtn");
    const deleteSegmentBtn = document.getElementById("deleteSegmentBtn");

    partCategory.addEventListener("change", () => {
      initPartDropdown(partCategory.value);
    });

    regionSelect.addEventListener("change", function() {
      if (this.value === "Other") {
        document.getElementById("generalNotes").focus();
      }
    });

    saveSegmentBtn.addEventListener("click", saveCurrentSegment);
    loadSegmentBtn.addEventListener("click", loadSavedSegment);
    deleteSegmentBtn.addEventListener("click", deleteSavedSegment);

    addAssemblyBtn.addEventListener("click", () => {
      const assemblyId = document.getElementById("assemblySelect").value;
      const qty = Number(document.getElementById("assemblyQty").value) || 0;

      if (!assemblyId) {
        alert("Select an assembly first.");
        return;
      }

      if (qty <= 0) {
        alert("Enter a quantity of at least 1.");
        return;
      }

      const template = assemblyTemplates[assemblyId];
      if (!template) {
        alert("No template defined for " + assemblyId);
        return;
      }

      template.forEach(item => addPartToUsage(item.partId, item.qty * qty));
      assembliesUsed[assemblyId] = (assembliesUsed[assemblyId] || 0) + qty;
    });

    clearPartsBtn.addEventListener("click", () => {
      if (confirm("Clear all parts from this form?")) {
        clearAllParts();
      }
    });

    addPartBtn.addEventListener("click", () => {
      const partId = document.getElementById("partSelect").value;
      const qty = document.getElementById("partQty").value;

      if (!partId) {
        alert("Please select a part.");
        return;
      }

      addPartToUsage(partId, qty);
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const region = document.getElementById("region").value;

      if (!region) {
        alert("Please select a region.");
        return;
      }

      const payload = {
        date: document.getElementById("workDate").value,
        region,
        techName: document.getElementById("techName").value.trim(),
        hoursWorked: document.getElementById("hoursWorked").value.trim(),
        notes: document.getElementById("generalNotes").value.trim(),
        timestamp: new Date().toISOString(),
        assemblies: Object.entries(assembliesUsed).map(([type, qty]) => ({ type, qty })),
        parts: Object.values(partsUsed),
      };

      jsonPreview.textContent = JSON.stringify(payload, null, 2);

     const confirmSubmit = confirm(
  `Submit daily passdown for ${region} with ${Object.values(partsUsed).length} part line(s)?`
);

if (!confirmSubmit) {
  return;
}

      const endpoint = "https://script.google.com/macros/s/AKfycbyEt9UFLn5TC4cDyECGdcgaYlloD0qAD3cnVcKabnyv0tbNVlCh1pEsi_80QLePCm9g/exec";

      fetch(endpoint, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(payload),
      })
      .then(() => {
        alert("Daily Passdown submitted. Check the Google Sheet to confirm it was logged.");
        clearAllParts();
        form.reset();
        initDate();
        initPartCategories();
        initPartDropdown();
      })
      .catch(err => {
        console.error(err);
        alert("Error sending to Google Sheets: " + err.message);
      });
    });
  });
</script>
</body>
</html>
